services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ptw-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - ptw-sqldata:/var/opt/mssql
    healthcheck:
      # /opt/mssql-tools18/ is correct for the 2022 image; -C trusts the self-signed cert.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  ptw-sqldata:
